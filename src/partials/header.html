<a class="skip-link" href="#contenu">Aller au contenu</a>
<header class="site-header" data-header>
<div class="scroll-progress" aria-hidden="true"><span data-scroll-progress></span></div>
<div class="hdr-bar" style="position: fixed; top: 16px; left: 0; right: 0; z-index: 80; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; font-family: 'Poppins', sans-serif;">
  <div class="hdr-pill" style="pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; max-width: 1240px; padding: 8px 8px 8px 20px; border-radius: 999px; background: rgba(255,253,247,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">
    <a href="index.html" aria-label="{{ site.nomComplet }} — accueil" style="display: flex; align-items: center; gap: 10px; text-decoration: none; min-height: 44px; flex-shrink: 0; margin-right: 10px;">
      <dc-import name="Logo" size="38"></dc-import>
      <span style="display: flex; flex-direction: column; gap: 3px; line-height: 1;">
        <span style="font-size: 14px; font-weight: 800; letter-spacing: 0.08em; color: #0F4D35; white-space: nowrap;">RACINES D'AVENIR</span>
        <span class="hdr-baseline" style="font-size: 7.6px; font-weight: 600; letter-spacing: 0.135em; color: #4E7F68; white-space: nowrap; text-transform: uppercase;">{{ site.statut }}</span>
      </span>
    </a>
    <nav class="hdr-desktop" aria-label="Menu principal" style="align-items: center; gap: 2px;">
      <sc-for list="{{ nav }}" as="item">
        <sc-if value="{{ item.active }}">
          <a href="{{ item.href }}" aria-current="page" title="{{ item.label }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; background: #E6EDE6; font-size: 14px; font-weight: 600; color: #0F4D35; text-decoration: none; white-space: nowrap;">{{ item.short }}</a>
        </sc-if>
        <sc-if value="{{ !item.active }}">
          <a href="{{ item.href }}" title="{{ item.label }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; color: #253A30; text-decoration: none; white-space: nowrap; transition: background .2s;" style-hover="background: #F7F5EC; color: #0F4D35;">{{ item.short }}</a>
        </sc-if>
      </sc-for>
    </nav>
    <a class="hdr-desktop" href="contact.html#formulaire" style="flex-shrink: 0; margin-left: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #F2B134; color: #0F4D35; font-weight: 700; font-size: 14px; text-decoration: none; align-items: center; white-space: nowrap; transition: transform .2s;" style-hover="transform: translateY(-1px); color: #0F4D35;">Je me préinscris</a>
    <button class="hdr-mobile" type="button" data-menu-toggle aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu-mobile" style="width: 48px; height: 48px; border-radius: 999px; border: none; background: #0F4D35; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <span data-icon-closed style="display: contents;"><dc-import name="Icon" icon="Menu" size="22" stroke="#FFFDF7" accent="#F2B134" sw="2"></dc-import></span>
      <span data-icon-open hidden style="display: contents;"><dc-import name="Icon" icon="X" size="22" stroke="#FFFDF7" accent="#F2B134" sw="2"></dc-import></span>
    </button>
  </div>
</div>
<div id="menu-mobile" class="hdr-menu" hidden style="position: fixed; inset: 0; z-index: 70; background: #0F4D35; padding: 104px 24px 32px; flex-direction: column; overflow-y: auto; font-family: 'Poppins', sans-serif;">
  <div aria-hidden="true" style="position: absolute; right: -80px; bottom: -80px; width: 280px; height: 280px; background: #F2B134; border-radius: 0 100% 0 100%; pointer-events: none;"></div>
  <nav aria-label="Menu mobile" style="position: relative; display: flex; flex-direction: column;">
    <sc-for list="{{ nav }}" as="item">
      <a href="{{ item.href }}" aria-current="{{ item.active ? 'page' : 'false' }}" style="min-height: 60px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: {{ item.active ? '#F2B134' : '#FFFDF7' }}; text-decoration: none; border-bottom: 1px solid rgba(230,237,230,.16);"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #F2B134; letter-spacing: 0.1em;">{{ item.n }}</span>{{ item.label }}</a>
    </sc-for>
  </nav>
  <a href="contact.html#formulaire" style="position: relative; margin-top: 28px; min-height: 60px; border-radius: 999px; background: #F2B134; color: #0F4D35; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center;">Je me préinscris</a>
  <a href="{{ site.whatsappLien }}" target="_blank" rel="noopener" style="position: relative; margin-top: 12px; min-height: 60px; border-radius: 999px; border: 2px solid rgba(255,253,247,.5); color: #FFFDF7; font-weight: 600; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px;"><dc-import name="Icon" icon="WhatsApp" size="22" fill="#FFFDF7"></dc-import>Écrire sur WhatsApp</a>
  <p style="position: relative; margin-top: 28px; font-family: 'Caveat', cursive; font-size: 32px; color: #E6EDE6;">Apprenez un métier, construisez votre avenir !</p>
</div>
</header>
